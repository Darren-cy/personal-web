name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://darrency.com

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        run: npm run validate

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify production routes
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://darrency.com/ > /dev/null

          redirect_result="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code} %{redirect_url}' \
            'https://www.darrency.com/ci-health?source=github-actions')"

          test "$redirect_result" = \
            '308 https://darrency.com/ci-health?source=github-actions'
